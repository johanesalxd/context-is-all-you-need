question: "How much vendor SLA credit is recoverable on Q3 Cold-Chain excursions?"

stage_story:
  step_title: "How Much Carrier Credit Can We Claim?"
  backend_layer: "Step 6 · Unstructured Contract Extraction"
  audience_role: "Procurement & Legal Lead"
  situation: "Turning to our chilled logistics carrier, ArcticHaul, Procurement digs deeper to calculate total Q3 SLA credit recoverable across qualifying chilled shipments."
  business_goal: "Recover every dollar owed under the latest signed contract amendment."
  tech_challenge: "ERP tables still enforce legacy thresholds while the signed June amendment lives in Drive PDFs."
  context_unlock: "Drive Connector, Object Tables & AI Extraction"

poll:
  prompt: "Our ERP ledger holds old 2025 SLA terms, while the signed 2026 amendment sits in a Drive PDF. What is the scalable fix?"
  options:
    - key: "A"
      text: "Paste every full contract PDF into the AI prompt each time Finance runs a query."
    - key: "B"
      text: "Extract signed rules once into a compact structured overlay table for SQL to join."
    - key: "C"
      text: "Rely on the ERP table alone because billing systems always override legal PDFs."
    - key: "D"
      text: "Skip automated checks since quarterly claim caps make small breaches worthless."
  correct_key: "B"
  reveal_takeaway: "Stuffing 40-page PDFs into every prompt wastes tokens and breaks arithmetic. Compiling signed Drive amendments once via Object Tables and AI extraction into a compact rule overlay unlocks 13.4x higher SLA recovery."

blind:
  answer_headline: "SGD 1,420.00 (3 breaches)"
  answer_detail: "Missed SGD 17,540.00 in recoverable credits because base vendor_sla_ledger applies legacy > 4.0 C for >= 90 min (5% credit), overlooking executed ArcticHaul Amendment #2."
  stage_delta_pill: "SGD 17.5K Left Unclaimed"
  stage_summary: "Left SGD 17.5K on the table. Used old 2025 contract terms and missed the signed June amendment."
  numeric_value: 1420.0
  unit: "SGD"
  query_language: "SQL"
  context_mechanism: "Structured ERP table only (base `vendor_sla_ledger`, unaware of Drive Amendment #2)"
  context_payload: |
    Unstructured Drive contracts not connected or compiled.
    Agent evaluated only base_temp_threshold_c (> 4.0 C), base_duration_min (>= 90), and base_credit_rate (0.05).
  sql_or_gql: |
    SELECT
      ROUND(SUM(shipment_invoice_sgd * base_credit_rate), 2) AS recoverable_credit_sgd,
      COUNT(*) AS qualifying_breaches
    FROM `${PROJECT_ID}.${DATASET_ID}.vendor_sla_ledger`
    WHERE quarter = '2026-Q3'
      AND temp_peak_celsius > base_temp_threshold_c
      AND excursion_duration_min >= base_duration_min
  tokens_used: 2150
  exploratory_queries: 3
  error_retries: 0
  eval_pass_count: 0
  eval_total_runs: 5
  trust_tier: "TIER_3_REVIEW_REQUIRED"
  rationale: "Ignores executed ArcticHaul Amendment #2 governing BIOLOGIC_CHILLED excursions."

governed:
  answer_headline: "SGD 18,960.00 (14 qualifying chilled shipments)"
  answer_detail: "Joining structured 480-token sla_overlay extracted from ArcticHaul_Amendment_2.md (> 2.0 C for >= 45 min -> 12% credit, cap SGD 35,000.00) recovers SGD 18,960.00 across 14 shipments."
  stage_delta_pill: "13.4x SLA Recovery"
  stage_summary: "13.4x higher SLA recovery (14 shipments) by applying the signed Amendment #2 rules automatically."
  numeric_value: 18960.0
  unit: "SGD"
  query_language: "SQL"
  context_mechanism: "Gemini Enterprise Drive Connector + BigQuery Object Tables + AI.GENERATE / DocAI (`sla_overlay`)"
  context_payload: |
    {
      "overlay_id": "OVL-ARCTIC-AMD2",
      "source_doc": "contracts/ArcticHaul_Amendment_2.md",
      "extraction_tokens": 480,
      "rule": "vendor_name='ArcticHaul' AND sku_class='BIOLOGIC_CHILLED' AND temp_peak_celsius > 2.0 AND excursion_duration_min >= 45 -> 12% credit",
      "quarterly_cap_sgd": 35000.00
    }
  sql_or_gql: |
    WITH evaluated_claims AS (
      SELECT
        l.event_id,
        l.vendor_name,
        COALESCE(o.quarterly_cap_sgd, 999999999.0) AS quarterly_cap_sgd,
        CASE
          WHEN o.overlay_id IS NOT NULL
            AND l.temp_peak_celsius > o.temp_threshold_c
            AND l.excursion_duration_min >= o.duration_threshold_min
          THEN l.shipment_invoice_sgd * o.credit_rate
          WHEN o.overlay_id IS NULL
            AND l.temp_peak_celsius > l.base_temp_threshold_c
            AND l.excursion_duration_min >= l.base_duration_min
          THEN l.shipment_invoice_sgd * l.base_credit_rate
          ELSE 0.0
        END AS raw_credit_sgd
      FROM `${PROJECT_ID}.${DATASET_ID}.vendor_sla_ledger` AS l
      LEFT JOIN `${PROJECT_ID}.${DATASET_ID}.sla_overlay` AS o
        ON l.vendor_name = o.vendor_name
       AND l.sku_class = o.sku_class
      WHERE l.quarter = '2026-Q3'
    ),
    vendor_capped AS (
      SELECT
        vendor_name,
        SUM(CASE WHEN raw_credit_sgd > 0 THEN 1 ELSE 0 END) AS qualifying_shipments,
        CASE
          WHEN SUM(raw_credit_sgd) > MAX(quarterly_cap_sgd) THEN MAX(quarterly_cap_sgd)
          ELSE SUM(raw_credit_sgd)
        END AS recoverable_credit_sgd
      FROM evaluated_claims
      GROUP BY vendor_name
    )
    SELECT
      ROUND(SUM(recoverable_credit_sgd), 2) AS recoverable_credit_sgd,
      SUM(qualifying_shipments) AS qualifying_shipments
    FROM vendor_capped
  tokens_used: 540
  exploratory_queries: 1
  error_retries: 0
  eval_pass_count: 5
  eval_total_runs: 5
  trust_tier: "TIER_1_VERIFIED_OR_COMPILED"
  rationale: "Deterministic SQL join against compiled 480-token sla_overlay extracted from ArcticHaul_Amendment_2.md (5/5 pass)."

