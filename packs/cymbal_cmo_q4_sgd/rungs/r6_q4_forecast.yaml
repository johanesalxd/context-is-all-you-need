      "verified_query": "#VQ-M6",
      "allocation_sgd": {"B2B_Search": 260000, "MY_Paid_Social": 220000, "Clean_SG_Paid_Social": 120000},
      "confidence_band_sgd": [1310000.0, 1540000.0],
      "unchanged_counterfactual_sgd": -145000.0
