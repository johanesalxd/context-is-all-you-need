  sql_or_gql: |
    SELECT
      ROUND(SUM(projected_q4_net_rev_sgd), 2) AS projected_q4_net_rev_sgd,
      ROUND(SUM(projected_q4_profit_sgd), 2) AS projected_q4_profit_sgd,
      ROUND(100.0 * SUM(projected_q4_profit_sgd) / NULLIF(SUM(planned_q4_spend_sgd), 0.0), 1) AS projected_roi_pct,
      ROUND(SUM(planned_q4_spend_sgd) - SUM(agency_clawback_offset_sgd), 2) AS net_new_cash_sgd,
      ROUND(SUM(unchanged_counterfactual_profit_sgd), 2) AS unchanged_profit_sgd
