      function getTurnEffectivePayload(turn, modeOverride) {
        var activeMode = modeOverride || state.mode;
        var base = activeMode === "blind" ? turn.blind : turn.governed;
        if (activeMode === "governed" && turn.rlsRoles && turn.rlsRoles.roles) {
          var roleKey = getActiveRlsRoleKey(turn.rlsRoles);
          var roleData = turn.rlsRoles.roles[roleKey] || turn.rlsRoles.roles[turn.rlsRoles.defaultRole];
          if (roleData) {
            return Object.assign({}, base, {
              headlineValue: roleData.headlineValue,
              headlineUnit: roleData.headlineUnit,
              summary: roleData.summary,
              consequence: roleData.consequence !== undefined ? roleData.consequence : base.consequence,
              kpis: roleData.kpis,
              chart: roleData.chart,
              table: roleData.table,
              activeRlsRole: roleData

        }
        return base;

      function getFollowUpsForLatestEntry(latestEntry) {
        var sc = getScenario();
        var askedSiblingIds = {};
        state.entries.forEach(function (e) {
          if (e.kind === "sibling" && e.siblingId) {
            askedSiblingIds[e.siblingId] = true;
          }
        });

        var nextIdx = getNextUnaskedTurnIndex();

        // In Raw Schema mode, NEVER leak grounded next-turn spoilers before the user has grounded once!
        if (getEntryMode(latestEntry) === "blind") {
          var lastPrimaryEntry = null;
          for (var pIdx = state.entries.length - 1; pIdx >= 0; pIdx--) {
            if (state.entries[pIdx].kind === "turn") {
              lastPrimaryEntry = state.entries[pIdx];
              break;
            }
          }
          var lastPrimary = lastPrimaryEntry ? sc.turns[lastPrimaryEntry.turnIndex] : null;
          var blindTurn = (latestEntry.kind === "turn") ? sc.turns[latestEntry.turnIndex] : lastPrimary;
          var blindList = (blindTurn && blindTurn.blindFollowUps && blindTurn.blindFollowUps.length)
            ? blindTurn.blindFollowUps
            : [
                { label: "Ground this analysis with Knowledge Catalog", kind: "ground" },
                sc.starterOptions[1],
                sc.starterOptions[2]
              ].filter(Boolean);

          var hasBeenGrounded = Boolean(latestEntry.groundedOnce || (lastPrimaryEntry && lastPrimaryEntry.groundedOnce));
          if (hasBeenGrounded && nextIdx !== null) {
            var anchorTurnBlind = (nextIdx > 0) ? sc.turns[nextIdx - 1] : null;
            var nextPrimaryBlind = (anchorTurnBlind && anchorTurnBlind.followUps && anchorTurnBlind.followUps[0] && anchorTurnBlind.followUps[0].kind === "primary")
              ? anchorTurnBlind.followUps[0]
              : { label: sc.turns[nextIdx].prompt, kind: "primary", targetTurnIndex: nextIdx };
            var blindSiblings = blindList.filter(function (o) {
              return o && o.kind === "sibling";
            });
            return [nextPrimaryBlind].concat(blindSiblings).slice(0, 3);
          }

          return blindList.slice(0, 3);
        }

        if (latestEntry.kind === "turn") {
          var turn = sc.turns[latestEntry.turnIndex];
          var raw = (turn && turn.followUps) ? turn.followUps.slice() : [];
          if (raw.length === 3) {
            if (raw[0].kind === "primary" && typeof raw[0].targetTurnIndex === "number") {
              var alreadyAsked = state.entries.some(function (e) {
                return e.kind === "turn" && e.turnIndex === raw[0].targetTurnIndex;
              });
              if (!alreadyAsked) {
                return raw;
              }
            } else if (nextIdx === null) {
              return raw;
            }
          }
        }

        var result = [];
        var usedLabels = {};

        function pushUnique(opt) {
          if (!opt || !opt.label || usedLabels[opt.label]) return;
          usedLabels[opt.label] = true;
          result.push(opt);
        }

        if (nextIdx !== null) {
          if (nextIdx === 0) {
            pushUnique({
              label: sc.starterOptions[0].label,
              kind: "primary",
              targetTurnIndex: 0
            });
          } else {
            var prevTurn = sc.turns[nextIdx - 1];
            var primaryOpt = prevTurn && prevTurn.followUps && prevTurn.followUps[0] && prevTurn.followUps[0].kind === "primary"
              ? prevTurn.followUps[0]
              : { label: sc.turns[nextIdx].prompt, kind: "primary", targetTurnIndex: nextIdx };
            pushUnique(primaryOpt);
          }
        }

        var candidatePool = [];
        if (nextIdx === 0) {
          sc.starterOptions.forEach(function (o) {
            if (o.kind === "sibling") candidatePool.push(o);
          });
        } else if (nextIdx !== null && nextIdx > 0) {
          var anchorTurn = sc.turns[nextIdx - 1];
          if (anchorTurn && anchorTurn.followUps) {
            anchorTurn.followUps.forEach(function (o) {
              if (o.kind === "sibling") candidatePool.push(o);
            });
          }
        } else {
          var lastTurn = sc.turns[sc.turns.length - 1];
          if (lastTurn && lastTurn.followUps) {
            lastTurn.followUps.forEach(function (o) {
              candidatePool.push(o);
            });
          }
        }

        sc.starterOptions.forEach(function (o) {
          if (o.kind === "sibling") candidatePool.push(o);
        });
        sc.turns.forEach(function (t) {
          (t.followUps || []).forEach(function (o) {
            if (o.kind === "sibling") candidatePool.push(o);
          });
        });

        candidatePool.forEach(function (o) {
          if (result.length < 3 && o.siblingId && !askedSiblingIds[o.siblingId]) {
            pushUnique({ label: o.label, kind: "sibling", siblingId: o.siblingId });
          }
        });
        candidatePool.forEach(function (o) {
          if (result.length < 3) {
            pushUnique({ label: o.label, kind: "sibling", siblingId: o.siblingId });
          }
        });

        return result.slice(0, 3);
      }

      function renderBarChartSvg(chart, animateBars, calmRawMode) {
        if (!chart || !chart.items || !chart.items.length) return "";
        var items = chart.items;
        var maxPos = 0;
        var maxNeg = 0;
        items.forEach(function (it) {
          var v = typeof it.value === "number" ? it.value : 0;
          if (v > maxPos) maxPos = v;
          if (v < 0 && Math.abs(v) > maxNeg) maxNeg = Math.abs(v);
        });
        var hasNeg = maxNeg > 0;
        if (maxPos <= 0 && !hasNeg) maxPos = 1;

        var width = 660;
        var rowH = 33;
        var totalH = items.length * rowH + 2;
        var zeroX = hasNeg ? Math.round(width * (maxNeg / (maxNeg + Math.max(maxPos, maxNeg * 0.25)))) : 0;
        if (hasNeg) {
          zeroX = Math.max(120, Math.min(width - 140, zeroX));
        }

        var rowsHtml = items.map(function (it, idx) {
          var y = idx * rowH + 1;
          var val = typeof it.value === "number" ? it.value : 0;
          var fillVar = "var(--bar-primary)";
          if (calmRawMode) {
            if (it.tone === "muted") fillVar = "var(--bar-muted)";
            else fillVar = idx === 0 ? "var(--bar-primary)" : "var(--bar-slate)";
          } else {
            if (it.tone === "success") fillVar = "var(--bar-success)";
            else if (it.tone === "danger") fillVar = "var(--bar-danger)";
            else if (it.tone === "warning") fillVar = "var(--bar-warning)";
            else if (it.tone === "accent") fillVar = "var(--bar-accent)";
            else if (it.tone === "muted") fillVar = "var(--bar-muted)";
          }

          var barCls = animateBars ? "ge-svg-bar is-animating" : "ge-svg-bar";
          var barRect = "";
          if (!hasNeg) {
            var pct = Math.max(0, Math.min(1, val / maxPos));
            var barW = val > 0 ? Math.max(10, Math.round(pct * width)) : 0;
            barRect = barW > 0
              ? '<rect class="' + barCls + '" x="0" y="18" width="' + barW + '" height="7" rx="3.5" fill="' + fillVar + '"/>'
              : "";
          } else {
            if (val >= 0) {
              var rSpan = width - zeroX;
              var rW = val > 0 ? Math.max(10, Math.round((val / Math.max(1, maxPos)) * rSpan)) : 0;
              barRect = rW > 0
                ? '<rect class="' + barCls + '" x="' + zeroX + '" y="18" width="' + rW + '" height="7" rx="3.5" fill="' + fillVar + '"/>'
                : "";
            } else {
              var lW = Math.max(10, Math.round((Math.abs(val) / Math.max(1, maxNeg)) * zeroX));
              barRect = '<rect class="' + barCls + '" x="' + (zeroX - lW) + '" y="18" width="' + lW + '" height="7" rx="3.5" fill="' + fillVar + '"/>';

              '<rect x="0" y="18" width="' + width + '" height="7" rx="3.5" fill="var(--chart-track)"/>' +
              barRect +
              (hasNeg ? '<line x1="' + zeroX + '" y1="16" x2="' + zeroX + '" y2="27" stroke="var(--on-surface-variant)" stroke-width="1.2"/>' : "") +
            "</g>"
          );
        }).join("");

        return (
          '<div class="ge-chart-box">' +
            '<div class="ge-chart-title">' + escapeHtml(chart.title) + "</div>" +
            '<svg class="ge-chart-svg" viewBox="0 0 ' + width + " " + totalH + '" role="img" aria-label="' + escapeHtml(chart.title) + '">' +
              rowsHtml +
            "</svg>" +

      function getEntrySteps(entry, payload) {
        if (payload && payload.thinkingSteps && payload.thinkingSteps.length) {
          return payload.thinkingSteps;
        }
        if (entry.kind === "turn") {
          return [];
        }
        if (state.mode === "blind") {
          return [
            { active: "Scanning BigQuery tables...", done: "Scanned BigQuery Raw Schema tables", meta: "0.4s", code: "INFORMATION_SCHEMA" },
            { active: "Running exploratory BigQuery SQL...", done: "Ran exploratory BigQuery SQL queries", meta: "0.8s", code: "BigQuery SQL" }
          ];
        }
        return [
          { active: "Searching Knowledge Catalog...", done: "Matched Context Set assets", meta: "0.2s", code: "SearchEntries" },
          { active: "Calling LookupContext via MCP...", done: "Called LookupContext (curated context)", meta: "0.3s", code: "LookupContext" },
          { active: "Running BigQuery query...", done: "Ran 1 governed BigQuery SQL query", meta: "0.8s", code: "BigQuery SQL" }
        ];
      }

      function buildTimelineInnerHtml(entry, payload) {
        var steps = getEntrySteps(entry, payload);
        var isTurn = entry.kind === "turn";
        var latencyLabel = payload && payload.telemetry && typeof payload.telemetry.latencySec === "number"
          ? payload.telemetry.latencySec.toFixed(1) + "s"
          : "0.9s";

        var timelineExpanded = !entry.thinkingDone || entry.timelineExpanded;
        var headerHtml = "";
        if (entry.thinkingDone) {
          headerHtml =
            '<span class="ge-tl-chevron"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>' +
            "<span>Worked for " + escapeHtml(latencyLabel) + " &middot; " + steps.length + " steps</span>";
        } else if (entry.phase === "initial_think") {
          headerHtml = svgSpark("ge-spark-spin", 15) + '<span class="ge-shimmer-text">Thinking it through...</span>';
        } else {
          headerHtml = svgSpark("ge-spark-spin", 15) + '<span class="ge-shimmer-text">Running tools...</span>';
        }

        var visibleSteps = entry.thinkingDone
          ? steps
          : (entry.phase === "initial_think" ? [] : steps.slice(0, entry.activeStepIdx + 1));

        var stepsHtml = visibleSteps.map(function (st, sIdx) {
          var stepFinished = entry.thinkingDone || sIdx < entry.activeStepIdx;
          return (
            '<div class="ge-tl-step ' + (stepFinished ? "" : "is-running") + '">' +
              '<span class="ge-tl-node">' + svgStepIcon(sIdx, stepFinished) + "</span>" +
              '<div class="ge-tl-body">' +
                "<span>" + formatPreviewBadges(stepFinished ? st.done : st.active) + "</span>" +
                (st.code ? '<span class="ge-tl-code">' + escapeHtml(st.code) + "</span>" : "") +
                (stepFinished && st.meta ? '<span class="ge-tl-meta">' + escapeHtml(st.meta) + "</span>" : "") +
              "</div>" +
            "</div>"
          );
        }).join("");

        return (
          '<div class="ge-timeline ' + (timelineExpanded && visibleSteps.length ? "is-expanded" : "") + '">' +
            '<button class="ge-tl-header" type="button" data-toggle-tl="' + escapeHtml(entry.entryId) + '">' +
              headerHtml +
            "</button>" +
            '<div class="ge-tl-rail">' + stepsHtml + "</div>" +
          "</div>"
        );
      }

      function buildRegroundBannerHtml(entry) {
        if (!entry.regrounding) return "";
        var toGov = state.regroundTargetMode === "governed";
        var steps = toGov
          ? [
              { active: "Searching Knowledge Catalog assets & glossary...", done: "Matched Knowledge Catalog glossary & verified rules", code: "SearchEntries" },
              { active: "Loading governed context bundle via MCP...", done: "Loaded curated table context & metric definitions", code: "LookupContext" },
              { active: "Running 1 verified BigQuery query...", done: "Executed governed BigQuery query", code: "BigQuery SQL" }
            ]
          : [
              { active: "Switching to ungrounded BigQuery raw schema...", done: "Disconnected Knowledge Catalog context", code: "Raw Schema" },
              { active: "Scanning 199 raw tables in INFORMATION_SCHEMA...", done: "Completed raw schema exploratory scan", code: "BigQuery SQL" }
            ];

        var visible = steps.slice(0, state.regroundStage + 1);
        var checkSvg = '<span class="ge-reground-check"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>';
        var rowsHtml = visible.map(function (st, idx) {
          var isDone = idx < state.regroundStage;

            '<div class="ge-reground-step ' + (isDone ? "" : "is-active") + '">' +
              (isDone ? checkSvg : '<span class="ge-live-dot" style="margin:0 5px;"></span>') +
              "<span>" + escapeHtml(isDone ? st.done : st.active) + "</span>" +
              '<span class="ge-reground-pill">' + escapeHtml(st.code) + "</span>" +
            "</div>"
          );
        }).join("");

        return (
          '<div class="ge-reground-card">' +
            '<div class="ge-reground-head">' +
              svgSpark("ge-spark-spin", 16) +
              '<span class="ge-shimmer-text">' + (toGov ? "Gemini 4 Neon is re-running with Knowledge Catalog..." : "Gemini 4 Neon is querying BigQuery Raw Schema...") + "</span>" +
            "</div>" +
            '<div class="ge-reground-list">' + rowsHtml + "</div>" +
          "</div>"
        );

      function buildArtifactCardHtml(entry, turn, payload) {
        var isTurn = entry.kind === "turn";
        var eMode = getEntryMode(entry);
        var isBlindTurn = isTurn && eMode === "blind";
        var isGovTurn = isTurn && eMode === "governed";
        var scCtx = (turn && turn.simpleContext) || {};

        // Per-card quick switcher (Raw Schema | Knowledge Catalog) right in the card header!
        var modeSwitchHtml = isTurn
          ? '<div class="ge-card-mode-switch" role="group" aria-label="Switch this answer between Raw Schema and Knowledge Catalog">' +
              '<button class="ge-card-mode-btn ' + (isBlindTurn ? "is-active-blind" : "") + '" type="button" data-entry-set-mode="blind" data-entry-id="' + escapeHtml(entry.entryId) + '">' +
                '<span class="ge-grounding-dot" style="width:6px; height:6px; opacity:' + (isBlindTurn ? "1" : "0.45") + '; background:' + (isBlindTurn ? "#d93025" : "currentColor") + ';"></span>' +
                "<span>Raw Schema</span>" +
              "</button>" +
              '<button class="ge-card-mode-btn ' + (isGovTurn ? "is-active-gov" : "") + '" type="button" data-entry-set-mode="governed" data-entry-id="' + escapeHtml(entry.entryId) + '">' +
                '<span class="ge-grounding-dot" style="width:6px; height:6px; opacity:' + (isGovTurn ? "1" : "0.45") + '; background:' + (isGovTurn ? "#1e8e3e" : "currentColor") + ';"></span>' +
                "<span>Knowledge Catalog</span>" +
              "</button>" +
            "</div>"
          : '<span class="ge-pill tone-success">' + escapeHtml(payload.badgeLabel || "Grounded in Knowledge Catalog") + '</span>';

        // Compact Before -> After Delta Strip on Governed cards
        var deltaStripHtml = (isGovTurn && scCtx.deltaBefore && scCtx.deltaAfter)
          ? '<div class="ge-delta-strip">' +
              '<div class="ge-delta-flow">' +
                '<span style="font-weight:650; color:var(--on-surface-variant);">Raw Schema:</span>' +
                '<span class="ge-delta-raw">' + escapeHtml(scCtx.deltaBefore) + "</span>" +
                '<span class="ge-delta-arrow">&rarr;</span>' +
                '<span class="ge-delta-gov">' + escapeHtml(scCtx.deltaAfter) + "</span>" +
              "</div>" +
              (scCtx.swingTag ? '<span class="ge-delta-swing">' + escapeHtml(scCtx.swingTag) + "</span>" : "") +
            "</div>"
          : "";

        // 3 Clean KPI Tiles
        var kpisHtml = (payload.kpis && payload.kpis.length)
          ? '<div class="ge-kpi-row">' + payload.kpis.map(function (k) {
              var toneCls = isBlindTurn ? "tone-neutral" : (k.tone ? "tone-" + k.tone : "");
              return (
                '<div class="ge-kpi-tile">' +
                  '<span class="ge-kpi-label">' + escapeHtml(String(k.label || "").replace(/\s*\[Preview\]/g, "")) + "</span>" +
                  '<span class="ge-kpi-value">' + escapeHtml(String(k.value || "").replace(/\s*\[Preview\]/g, "")) + "</span>" +
                  '<span class="ge-kpi-delta ' + toneCls + '">' + escapeHtml(String(k.delta || "").replace(/\s*\[Preview\]/g, "")) + "</span>" +
                "</div>"
              );
            }).join("") + "</div>"
          : "";

        // Bespoke Per-Turn Main Visual (6 unique visual types!)
        var visualHtml = isTurn
          ? renderMainTurnVisual(turn, eMode, Boolean(entry.animateBars))
          : (payload.customVisual === "session_audit_scoreboard"
              ? renderVizSessionAuditScoreboard()
              : (payload.chart ? renderBarChartSvg(payload.chart, Boolean(entry.animateBars), false) : ""));

        // Optional Breakdown Table (tucked neatly behind a toggle so each turn fits on 1 screen!)
        var tableOpen = Boolean(entry.tableExpanded);
        var tableHtml = payload.table
          ? '<div class="ge-table-collapsible ' + (tableOpen ? "is-open" : "") + '">' + renderTableHtml(payload.table) + "</div>"
          : "";

        // Plain-English 1-Line Context Takeaway (Governed) OR Prominent Re-Run CTA (Raw Schema)
        var actionOrTakeawayHtml = "";
        if (isBlindTurn) {
          actionOrTakeawayHtml =
            '<div class="ge-rerun-kc-bar">' +
              '<div class="ge-rerun-kc-hint">' +
                '<span style="width:8px; height:8px; border-radius:50%; background:#d93025; flex-shrink:0;"></span>' +
                "<span>Answered using <strong>Raw Schema</strong> only (no business definitions or catalog rules).</span>" +
              "</div>" +
              '<button class="ge-rerun-kc-btn" type="button" data-entry-set-mode="governed" data-entry-id="' + escapeHtml(entry.entryId) + '">' +
                svgSpark("", 15) +
                "<span>Re-run with Knowledge Catalog</span>" +
                '<span class="ge-rerun-kbd">G</span>' +
              "</button>" +
            "</div>";
        } else if (((isGovTurn && scCtx.badge && scCtx.oneLiner) || (!isTurn && payload.simpleContext && payload.simpleContext.badge && payload.simpleContext.oneLiner))) {
          var tCtx = isTurn ? scCtx : payload.simpleContext;
          actionOrTakeawayHtml =
            '<div class="ge-impact-note is-governed">' +
              '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; margin-top:2px;">' +
                '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>' +
              "</svg>" +
              "<span><strong>" + escapeHtml(tCtx.badge) + ":</strong> " + escapeHtml(tCtx.oneLiner) + "</span>" +
            "</div>";
        }

        var telemetryLine = payload && payload.telemetry
          ? escapeHtml(
              payload.telemetry.queryLabel ||
              (payload.telemetry.sqlCount + " " + (payload.queryLang === "ISO GQL" ? "GQL" : "SQL") +
               (payload.telemetry.sqlCount > 1 ? "s" : ""))
            ) + " &middot; " + payload.telemetry.latencySec.toFixed(1) + "s"
          : escapeHtml(GOV_LABEL) + " &middot; 1 governed query";

        var tableBtnHtml = payload.table
          ? '<button class="ge-footer-link" type="button" data-toggle-table="' + escapeHtml(entry.entryId) + '">' +
              "<span>" + (tableOpen ? "Hide table" : "Data table") + "</span>" +
            "</button>"
          : "";

        var hasInspectableSql = isTurn || Boolean(payload && payload.queryCode);
        var footerActions = hasInspectableSql
          ? '<div class="ge-card-actions">' +
              tableBtnHtml +
              '<button class="ge-footer-link" type="button" data-inspect-entry="' + escapeHtml(entry.entryId) + '" data-inspect-mode="visual">' +
                '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><line x1="15" y1="4" x2="15" y2="20"/></svg>' +
                "<span>Explain Context</span>" +
              "</button>" +
              '<button class="ge-footer-link" type="button" data-inspect-entry="' + escapeHtml(entry.entryId) + '" data-inspect-mode="sql">' +
                '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>' +
                "<span>View " + escapeHtml(payload.queryLang || "SQL") + "</span>" +
              "</button>" +
            "</div>"
          : '<div class="ge-card-actions">' + tableBtnHtml + "</div>";

        var cardCls = "ge-artifact-card";
        if (isBlindTurn) cardCls += " is-card-blind";
        if (isGovTurn || (!isTurn && payload && payload.customVisual === "session_audit_scoreboard")) cardCls += " is-card-gov";
        if (entry.animateCard) cardCls += " is-revealing";
        if (entry.regroundPulse) cardCls += " is-regrounding";
        if (entry.regrounding) cardCls += " is-shimmer-dim";

        return (
          '<div class="' + cardCls + '">' +
            '<div class="ge-card-head">' +
              '<div class="ge-hero-block">' +
                '<div class="ge-hero-value">' + escapeHtml(payload.headlineValue) + "</div>" +
                '<div class="ge-hero-unit">' + escapeHtml(payload.headlineUnit) + "</div>" +
              "</div>" +
              '<div class="ge-card-badges">' +
                modeSwitchHtml +
              "</div>" +
            "</div>" +
            deltaStripHtml +
            kpisHtml +
            visualHtml +
            tableHtml +
            actionOrTakeawayHtml +
            '<div class="ge-card-footer">' +
              '<span class="ge-card-telemetry">' + telemetryLine + "</span>" +
              footerActions +
            "</div>" +
          "</div>"
        );
      }

      function buildFollowUpsHtml(entry) {

          '<div class="ge-followups" id="activeFollowUps">' +
            '<div class="ge-followups-label">Suggested follow-ups</div>' +

              followUps.map(function (opt, fIdx) {

                  ? svgSpark("ge-followup-icon", 15)

                      '<polyline points="9 10 4 15 9 20"/>' +

                  "</button>"

            "</div>" +
          "</div>"
        );

      function buildAgentBlockInnerHtml(entry, isLatest) {
        var sc = getScenario();
        var isTurn = entry.kind === "turn";
        var turn = isTurn ? sc.turns[entry.turnIndex] : null;
        var sibling = !isTurn ? sc.siblingResponses[entry.siblingId] : null;
        var payload = isTurn ? getTurnEffectivePayload(turn, getEntryMode(entry)) : sibling;

        var tlHtml = buildTimelineInnerHtml(entry, payload);
        var regroundHtml = buildRegroundBannerHtml(entry);

        var proseHtml = "";
        if (entry.thinkingDone && payload) {
          if (entry.streamDone) {
            proseHtml =
              '<div class="ge-prose">' +
                "<p>" + formatProse(payload.summary) + renderCitationsInline(payload.citations) + "</p>" +
              "</div>";
          } else {
            proseHtml =
              '<div class="ge-prose">' +
                '<p><span class="ge-stream-text">' + (entry.streamedHtml || "") + '</span><span class="ge-stream-cursor"></span></p>' +
              "</div>";
          }
        }

        var cardHtml = (entry.cardShown && payload) ? buildArtifactCardHtml(entry, turn, payload) : "";
        var followUpHtml = (isLatest && entry.followUpsShown) ? buildFollowUpsHtml(entry) : "";

        return tlHtml + regroundHtml + proseHtml + cardHtml + followUpHtml;
      }

      function renderTurnEntryHtml(entry, isLatest) {
        return (
          '<article class="ge-turn-pair ' + (entry.entering ? "is-entering" : "") + '" data-entry-id="' + escapeHtml(entry.entryId) + '">' +
            '<div class="ge-user-row">' +
              '<div class="ge-user-bubble">' + escapeHtml(entry.promptText) + "</div>" +

            '<div class="ge-agent-block">' +

      function wireEntryInteractions(rootEl, latestEntry) {
        if (!rootEl) return;

        rootEl.querySelectorAll("[data-entry-set-mode]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var nextMode = this.getAttribute("data-entry-set-mode");

            setEntryMode(eid, nextMode);
            this.blur();
          });
        });

        rootEl.querySelectorAll("[data-toggle-table]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var eid = this.getAttribute("data-toggle-table");
            var target = state.entries.find(function (e) { return e.entryId === eid; });
            if (target) {
              target.tableExpanded = !target.tableExpanded;
              updateSingleEntryDom(target);
            }
            this.blur();
          });
        });

        rootEl.querySelectorAll("[data-toggle-tl]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var id = this.getAttribute("data-toggle-tl");
            var entry = state.entries.find(function (e) { return e.entryId === id; });
            if (entry && entry.thinkingDone) {
              entry.timelineExpanded = !entry.timelineExpanded;
              updateSingleEntryDom(entry);
            }
          });
        });

        rootEl.querySelectorAll("[data-rls-role]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var role = this.getAttribute("data-rls-role");
            setRlsRole(role);
            this.blur();
          });
        });

        rootEl.querySelectorAll("[data-inspect-entry]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var entryId = this.getAttribute("data-inspect-entry");
            var mode = this.getAttribute("data-inspect-mode") || "visual";
            state.selectedEntryId = entryId;
            if (mode === "sql") {
              state.techProofOpen = true;
              state.techProofTab = "sql";
            } else {
              state.techProofOpen = false;
            }
            openInspector(true);
            if (mode === "sql") {
              requestAnimationFrame(function () {
                var proofEl = document.getElementById("inspTechProof");
                if (proofEl) proofEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
              });
            }
            this.blur();
          });
        });

        if (latestEntry && latestEntry.followUpsShown) {
          var followUps = getFollowUpsForLatestEntry(latestEntry);
          rootEl.querySelectorAll("[data-followup-idx]").forEach(function (btn) {
            btn.addEventListener("click", function () {
              var idx = parseInt(this.getAttribute("data-followup-idx"), 10);
              var opt = followUps[idx];
              if (opt) handleOptionSelection(opt);
              this.blur();
            });
          });
        }

        rootEl.querySelectorAll(".ge-citation-chip").forEach(function (chip) {
          chip.addEventListener("click", function (ev) {
            ev.stopPropagation();
            if (activeCitationEl === this && els.citationPopover.classList.contains("is-open")) {
              hideCitationPopover();
            } else {
              showCitationPopover(this);
            }
          });
          chip.addEventListener("mouseenter", function () {
            clearTimeout(citHideTimer);
            showCitationPopover(this);
          });
          chip.addEventListener("mouseleave", function () {
            scheduleHideCitationPopover();
          });
        });

      function updateSingleEntryDom(entry) {
        var article = els.threadList.querySelector('[data-entry-id="' + entry.entryId + '"]');

        if (!agentBlock) return;
        var latestIdx = state.entries.length - 1;
        var isLatest = state.entries[latestIdx] && state.entries[latestIdx].entryId === entry.entryId;
        agentBlock.innerHTML = buildAgentBlockInnerHtml(entry, isLatest);
        wireEntryInteractions(agentBlock, isLatest ? entry : null);

          triggerBarGrowth(agentBlock);
          entry.animateBars = false;

        entry.animateCard = false;
        entry.regroundPulse = false;

      function wireInspectorHandlers() {
        els.inspTurnBarMount.querySelectorAll("[data-select-insp]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            state.selectedEntryId = this.getAttribute("data-select-insp");
            renderInspector();
            this.blur();
          });
        });

        els.inspBodyMount.querySelectorAll("[data-select-insp]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            state.selectedEntryId = this.getAttribute("data-select-insp");
            renderInspector();
            this.blur();
          });
        });

        els.inspBodyMount.querySelectorAll("[data-insp-set-mode]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var nextMode = this.getAttribute("data-insp-set-mode");

              setMode(nextMode);
            }
            this.blur();

      /* ======================== INTERACTION & LIVE EXECUTION ENGINE ======================== */
      function scrollToLatestEntryStart(smooth) {
        function doScroll() {
          if (!els.threadScroll) return;
          var articles = els.threadList ? els.threadList.querySelectorAll(".ge-turn-pair") : [];
          var target = articles.length ? articles[articles.length - 1] : null;
          if (!target) return;
          var scrollRect = els.threadScroll.getBoundingClientRect();
          var targetRect = target.getBoundingClientRect();
          var top = Math.max(0, els.threadScroll.scrollTop + (targetRect.top - scrollRect.top) - 8);
          if (Math.abs(els.threadScroll.scrollTop - top) <= 2) return;
          if (smooth && typeof els.threadScroll.scrollTo === "function") {
            els.threadScroll.scrollTo({ top: top, behavior: "smooth" });
          } else {
            var prevBehavior = els.threadScroll.style.scrollBehavior;
            els.threadScroll.style.scrollBehavior = "auto";
            els.threadScroll.scrollTop = top;
            els.threadScroll.style.scrollBehavior = prevBehavior;
          }
        }
        if (smooth) {
          requestAnimationFrame(doScroll);
        } else {
          doScroll();
          requestAnimationFrame(doScroll);
        }
      }

      function scrollToBottom() {
        scrollToLatestEntryStart(true);
      }

      function openInspector(open) {
        var next = typeof open === "boolean" ? open : !state.inspectorOpen;
        if (next === state.inspectorOpen) {
          renderInspector();
          return;
        }
        state.inspectorOpen = next;

        if (next) {
          if (window.innerWidth <= 1680 && !state.railCollapsed) {
            state.railCollapsed = true;
            state.autoCollapsedByInspector = true;
          }
        } else {
          if (state.autoCollapsedByInspector) {
            state.railCollapsed = false;
            state.autoCollapsedByInspector = false;
          }
        }

        renderRail();
        renderTopbar();
        renderInspector();
      }

      function setEntryMode(entryId, newMode) {
        if (newMode !== "blind" && newMode !== "governed") return;
        var targetEntry = state.entries.find(function (e) { return e.entryId === entryId; }) || getCurrentFocusEntry();

        // Welcome screen (0 turns): instant switch
        if (!targetEntry) {
          state.mode = newMode;
          renderTopbar();
          renderConnectorChips();
          renderInspector();
          showToast(newMode === "governed" ? "Mode set to " + GOV_LABEL : "Mode set to " + RAW_LABEL);
          return;
        }

        if (getEntryMode(targetEntry) === newMode && !state.isRegrounding) return;

        if (state.isThinking) {
          finalizeInFlightEntries();
          renderThread();
        }
        clearRegroundTimers();

        state.selectedEntryId = targetEntry.entryId;
        state.isRegrounding = true;
        state.regroundTargetMode = newMode;
        state.regroundStage = 0;
        targetEntry.regrounding = true;

        renderTopbar();
        updateSingleEntryDom(targetEntry);

        regroundTimers.push(setTimeout(function () {
          state.regroundStage = 1;
          updateSingleEntryDom(targetEntry);
        }, newMode === "governed" ? 800 : 700));

        if (newMode === "governed") {
          regroundTimers.push(setTimeout(function () {
            state.regroundStage = 2;
            updateSingleEntryDom(targetEntry);
          }, 1650));
        }

        regroundTimers.push(setTimeout(function () {
          targetEntry.mode = newMode;
          targetEntry.regrounding = false;
          if (newMode === "governed") {
            targetEntry.groundedOnce = true;
          }
          if (targetEntry.thinkingDone) {
            targetEntry.regroundPulse = true;
            targetEntry.animateBars = true;
          }
          state.mode = newMode;
          state.isRegrounding = false;
          state.regroundTargetMode = null;
          state.regroundStage = 0;

          renderTopbar();
          renderConnectorChips();
          updateSingleEntryDom(targetEntry);
          renderInspector();
          var artEl = els.threadList.querySelector('[data-entry-id="' + targetEntry.entryId + '"]');
          if (artEl) artEl.scrollIntoView({ behavior: "smooth", block: "start" });
          showToast(newMode === "governed"
            ? "Re-grounded with " + GOV_LABEL
            : "Switched turn to " + RAW_LABEL);
        }, newMode === "governed" ? 2450 : 1500));
      }

      function jumpToTurnIndex(turnIdx) {

        var sc = getScenario();
        var selected = state.entries.find(function (e) { return e.entryId === state.selectedEntryId; });
        var latest = state.entries.length ? state.entries[state.entries.length - 1] : null;
        var activeRlsEntry = (selected && selected.kind === "turn" && sc.turns[selected.turnIndex] && sc.turns[selected.turnIndex].rlsRoles)
          ? selected
          : ((latest && latest.kind === "turn" && sc.turns[latest.turnIndex] && sc.turns[latest.turnIndex].rlsRoles) ? latest : null);
        if (!activeRlsEntry) return;
        var rlsCfg = sc.turns[activeRlsEntry.turnIndex].rlsRoles;
        var keys = Object.keys(rlsCfg.roles);
        if (keys.length < 2) return;
        var curIdx = keys.indexOf(getActiveRlsRoleKey(rlsCfg));
        var nextKey = keys[(curIdx + 1) % keys.length];
        setRlsRole(nextKey);

      function resetToWelcome() {

        clearRegroundTimers();

        showToast("Loaded scenario: " + DATA.scenarios[nextScenarioId].shortLabel);

      function appendEntryAndAnimate(entryConfig, instant) {
        if ((state.isThinking || state.isRegrounding) && !instant) return;
        hideCitationPopover();

        entrySeq += 1;
        var entryInitialMode = entryConfig.initialMode || (entryConfig.kind === "turn" ? "blind" : "governed");
        var entry = {
          entryId: "e-" + entrySeq,
          kind: entryConfig.kind,
          mode: entryInitialMode,
          promptText: entryConfig.promptText,
          turnIndex: typeof entryConfig.turnIndex === "number" ? entryConfig.turnIndex : null,
          siblingId: entryConfig.siblingId || null,
          phase: instant ? "done" : "initial_think",
          timelineExpanded: false,
          tableExpanded: false,
          thinkingDone: Boolean(instant),
          streamDone: Boolean(instant),
          streamedHtml: null,
          cardShown: Boolean(instant),
          followUpsShown: Boolean(instant),
          activeStepIdx: 0,
          entering: !instant,
          animateCard: false,
          animateBars: false,
          regroundPulse: false,
          regrounding: false,
          groundedOnce: entryInitialMode === "governed"
        };
        if (entryConfig.kind === "turn") {
          state.mode = entryInitialMode;
          state.selectedEntryId = entry.entryId;
        }
        // Auto-collapse left rail once conversation starts for maximum ballroom legibility
        if (!state.userToggledRail && !state.railCollapsed) {
          state.railCollapsed = true;
        }

        state.entries.push(entry);

        if (instant) {
          if (entry.kind === "turn") {
            state.selectedEntryId = entry.entryId;
          }
          return;
        }

        state.isThinking = true;
        renderRail();
        renderTopbar();
        renderWelcome();

        // Hide previous entry's follow-ups without re-animating earlier turns
        var oldFollowUps = document.getElementById("activeFollowUps");
        if (oldFollowUps) oldFollowUps.remove();

        // Append ONLY the new article so prior turns stay rock-steady
        var tempWrap = document.createElement("div");
        tempWrap.innerHTML = renderTurnEntryHtml(entry, true);
        var newArticle = tempWrap.firstElementChild;
        if (newArticle) {
          els.threadList.appendChild(newArticle);
          wireEntryInteractions(newArticle, null);
        }
        entry.entering = false;
        scrollToBottom();

        var sc = getScenario();
        var turn = entry.kind === "turn" ? sc.turns[entry.turnIndex] : null;
        var payload = entry.kind === "turn"
          ? getTurnEffectivePayload(turn, entry.mode)
          : sc.siblingResponses[entry.siblingId];
        var steps = getEntrySteps(entry, payload);
        var stepCount = Math.max(1, steps.length);

        // Realistic live pacing:
        // 700ms "Thinking it through..." shimmer -> sequential steps -> 800ms prose stream -> card + 450ms bars -> +250ms follow-ups
        var isBlind = entry.mode === "blind" && entry.kind === "turn";
        var initialThinkMs = 950;
        var stepDurations = [];
        for (var d = 0; d < stepCount; d++) {
          if (isBlind) {
            // Raw Schema exploratory: 950-1250ms per step (~4.2s total for 3 steps)
            stepDurations.push(d === 1 ? 1450 : (d === 0 ? 1250 : 1300));
          } else {
            // Knowledge Catalog single-shot grounded: faster (~2.95s total for 3 steps)
            stepDurations.push(d === 1 ? 900 : 800);
          }
        }

        var elapsed = initialThinkMs;
        for (var i = 0; i < stepCount; i++) {
          (function (stepNum, startAt) {
            thinkingTimers.push(setTimeout(function () {
              entry.phase = "stepping";
              entry.activeStepIdx = stepNum;
              updateSingleEntryDom(entry);
              scrollToBottom();
            }, startAt));
          })(i, elapsed);
          elapsed += stepDurations[i];
        }

        // Phase 2: Complete tool steps and start smooth chunked prose streaming (800ms)
        thinkingTimers.push(setTimeout(function () {
          entry.phase = "streaming";
          entry.thinkingDone = true;
          entry.timelineExpanded = false;
          entry.streamDone = false;
          entry.streamedHtml = "";

          if (entry.kind === "turn" || entry.siblingId === "closing_session_audit" || !state.selectedEntryId) {
            state.selectedEntryId = entry.entryId;
          }
          renderInspector();

          var fullFormatted = formatProse(payload ? payload.summary : "");
          var tokens = buildStreamTokens(fullFormatted);
          var totalChunks = 16;
          var chunkIntervalMs = 48; // 16 * 50ms = 800ms (within 750-900ms spec)
          var tokensPerChunk = Math.max(1, Math.ceil(tokens.length / totalChunks));
          var currentChunk = 0;

          updateSingleEntryDom(entry);
          scrollToBottom();

          function emitNextChunk() {
            currentChunk += 1;
            var endIdx = Math.min(tokens.length, currentChunk * tokensPerChunk);
            entry.streamedHtml = tokens.slice(0, endIdx).join("");

            var art = els.threadList.querySelector('[data-entry-id="' + entry.entryId + '"]');
            var streamSpan = art ? art.querySelector(".ge-stream-text") : null;
            if (streamSpan) {
              streamSpan.innerHTML = entry.streamedHtml;
            }
            scrollToBottom();

            if (endIdx < tokens.length) {
              thinkingTimers.push(setTimeout(emitNextChunk, chunkIntervalMs));
            } else {
              // Phase 3: Finish prose + citations + slide-fade Answer Artifact Card + 450ms SVG bar growth
              thinkingTimers.push(setTimeout(function () {
                entry.streamDone = true;
                entry.streamedHtml = null;
                entry.cardShown = true;
                entry.animateCard = true;
                entry.animateBars = true;
                updateSingleEntryDom(entry);
                scrollToBottom();

                // Phase 4: Fade in the 3 Suggested Follow-Ups 250ms after card reveal
                thinkingTimers.push(setTimeout(function () {
                  entry.phase = "done";
                  entry.followUpsShown = true;
                  state.isThinking = false;
                  var latestArt = els.threadList.querySelector('[data-entry-id="' + entry.entryId + '"]');
                  var agentBlk = latestArt ? latestArt.querySelector(".ge-agent-block") : null;
                  if (agentBlk && !agentBlk.querySelector("#activeFollowUps")) {
                    var fuWrap = document.createElement("div");
                    fuWrap.innerHTML = buildFollowUpsHtml(entry);
                    var fuEl = fuWrap.firstElementChild;
                    if (fuEl) {
                      agentBlk.appendChild(fuEl);
                      wireEntryInteractions(fuEl, entry);
                    }
                  } else {
                    updateSingleEntryDom(entry);
                  }
                  renderInspector();
                  scrollToBottom();
                }, 250));
              }, 70));
            }
          }

          emitNextChunk();
        }, elapsed));
      }

      function handleOptionSelection(opt, customPromptText) {
        if (!opt) return;
        if (opt.kind === "ground") {
          setMode("governed");
          return;
        }
        var text = customPromptText || opt.label;
        if (opt.kind === "primary" && typeof opt.targetTurnIndex === "number") {
          appendEntryAndAnimate({
            kind: "turn",
            promptText: text,
            turnIndex: opt.targetTurnIndex,
            initialMode: "blind"
          }, false);
        } else if (opt.siblingId) {
          appendEntryAndAnimate({
            kind: "sibling",
            promptText: text,
            siblingId: opt.siblingId
          }, false);
        }
      }

      function triggerPrimaryOption() {
        if (state.isThinking || state.isRegrounding) return;
        var sc = getScenario();
        if (state.entries.length === 0) {
          handleOptionSelection(sc.starterOptions[0]);
          return;
        }
        var latest = state.entries[state.entries.length - 1];
        if (!latest || !latest.followUpsShown) return;
        var followUps = getFollowUpsForLatestEntry(latest);
        if (followUps.length) {
          handleOptionSelection(followUps[0]);
        }
      }

      function tokenizeQuery(text) {
        var stop = {
          the: 1, and: 1, for: 1, are: 1, our: 1, can: 1, what: 1, with: 1,
          from: 1, that: 1, this: 1, how: 1, much: 1, did: 1, had: 1, all: 1,
          give: 1, show: 1, tell: 1, about: 1, into: 1, across: 1, last: 1
        };
        return String(text || "")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, " ")
          .trim()
          .split(/\s+/)
          .filter(function (w) { return w.length >= 3 && !stop[w]; });
      }

      function matchFreeFormPrompt(rawText) {
        var sc = getScenario();
        // 1. On Welcome screen (first question), ANYTHING typed (even with typos) runs Q1 from Raw Schema!
        if (state.entries.length === 0) {
          return { kind: "primary", targetTurnIndex: 0, label: rawText };
        }
        // 2. Once Q6 has been grounded in Knowledge Catalog, ANYTHING typed manually (even with typos!)
        //    triggers the live Session Audit & LLM-as-a-Judge Scoreboard with your exact typed bubble!
        var q6Entry = state.entries.find(function (e) { return e.kind === "turn" && e.turnIndex === 5; });
        var latestEntry = state.entries[state.entries.length - 1];
        var rawLow = String(rawText || "").toLowerCase();
        var looksLikeAudit = /(compare|audit|scoreboard|summary|session|judge|token|trace|logs|raw.*kc|raw.*catalog|kc.*raw)/.test(rawLow);
        if ((q6Entry && getEntryMode(q6Entry) === "governed") || (latestEntry && latestEntry.kind === "turn" && latestEntry.turnIndex === 5 && getEntryMode(latestEntry) === "governed")) {
          if (sc.siblingResponses && sc.siblingResponses.closing_session_audit) {
            return { kind: "sibling", siblingId: "closing_session_audit", label: rawText };
          }
        }
        if (looksLikeAudit && state.entries.length >= 2 && sc.siblingResponses && sc.siblingResponses.closing_session_audit) {
          return { kind: "sibling", siblingId: "closing_session_audit", label: rawText };
        }
        var qTokens = tokenizeQuery(rawText);

        var askedMap = {};
        state.entries.forEach(function (e) {
          if (e.kind === "turn") askedMap[e.turnIndex] = true;
        });

        var bestIdx = -1;
        var bestScore = 0;

        sc.turns.forEach(function (turn, idx) {
          if (askedMap[idx]) return;
          var haystack = tokenizeQuery(
            (turn.prompt || "") + " " + (turn.turnTitle || "") + " " + (turn.layerFeature || "")
          );
          var haySet = {};
          haystack.forEach(function (w) { haySet[w] = true; });
          var score = 0;
          qTokens.forEach(function (w) {
            if (haySet[w]) score += 1;
          });
          if (score > bestScore) {
            bestScore = score;
            bestIdx = idx;
          }
        });

        if (bestIdx >= 0 && bestScore >= 3) {
          return { kind: "primary", targetTurnIndex: bestIdx, label: rawText };
        }

        var nextIdx = getNextUnaskedTurnIndex();
        if (nextIdx !== null) {
          return { kind: "primary", targetTurnIndex: nextIdx, label: rawText };
        }

        var latest = state.entries[state.entries.length - 1];
        var followUps = latest ? getFollowUpsForLatestEntry(latest) : [];
        if (followUps.length) {
          return Object.assign({}, followUps[0], { label: rawText });
        }
        return { kind: "primary", targetTurnIndex: 0, label: rawText };
      }

      function submitComposer(textarea) {
        if (state.isThinking || state.isRegrounding) return;
        var val = (textarea.value || "").trim();

        autoResizeTextarea(textarea);
        if (!val) {
          triggerPrimaryOption();
          return;
        }
        var matched = matchFreeFormPrompt(val);
        handleOptionSelection(matched, val);

        pop.classList.add("is-open");

        var rect = chipEl.getBoundingClientRect();
        var popW = Math.min(390, window.innerWidth - 24);
        var popH = pop.offsetHeight || 130;

        var left = rect.left;
        if (left + popW > window.innerWidth - 12) {
          left = window.innerWidth - popW - 12;
        }
        if (left < 12) left = 12;

        var top = rect.bottom + 8;
        if (top + popH > window.innerHeight - 12) {
          top = rect.top - popH - 8;
        }
        if (top < 12) top = 12;

        pop.style.left = Math.round(left) + "px";
        pop.style.top = Math.round(top) + "px";
      }

      document.addEventListener("keydown", function (ev) {
        var tag = document.activeElement ? document.activeElement.tagName : "";
        var isTyping = tag === "TEXTAREA" || tag === "INPUT" || tag === "SELECT";

        if (ev.key === "Escape") {
          if (activeCitationEl) {
            hideCitationPopover();
            return;
          }
          if (state.presenterOpen) {
            state.presenterOpen = false;
            renderPresenterPopover();
            return;
          }
          if (state.inspectorOpen) {
            openInspector(false);
            return;
          }
        }

        if (ev.shiftKey && (ev.key === "P" || ev.key === "p") && !isTyping) {
          ev.preventDefault();
          state.presenterOpen = !state.presenterOpen;
          renderPresenterPopover();
          return;
        }

        if (isTyping || ev.metaKey || ev.ctrlKey || ev.altKey) return;

        if ((ev.key === " " || ev.key === "Enter") && !state.presenterOpen) {
          var isBtnOrLink = tag === "BUTTON" || tag === "A";
          if (!isBtnOrLink) {
            ev.preventDefault();
            triggerPrimaryOption();
          }
          return;
        }

        var lower = ev.key.toLowerCase();
        if (ev.key >= "1" && ev.key <= "6") {
          ev.preventDefault();
          jumpToTurnIndex(parseInt(ev.key, 10) - 1);
          return;
        }
        if (ev.key === "7") {
          ev.preventDefault();
          var sc7 = getScenario();
          if (sc7.siblingResponses && sc7.siblingResponses.closing_session_audit) {
            appendEntryAndAnimate({
              kind: "sibling",
              promptText: "Compare Raw Schema vs. Knowledge Catalog runs from this session",
              siblingId: "closing_session_audit"
            }, false);
          }
          return;

        if (lower === "g") {
          ev.preventDefault();
          var curF = getCurrentFocusEntry();
          var effectiveCur = state.isRegrounding ? state.regroundTargetMode : (curF ? getEntryMode(curF) : state.mode);
          setMode(effectiveCur === "governed" ? "blind" : "governed");
        } else if (lower === "x") {
          ev.preventDefault();
          openInspector();
        } else if (lower === "t") {
          ev.preventDefault();
          setTheme(state.theme === "dark" ? "daylight" : "dark");
        } else if (lower === "r") {
          ev.preventDefault();
          toggleRlsRole();
        } else if (lower === "n") {
          ev.preventDefault();
          resetToWelcome();
        } else if (lower === "f") {
          ev.preventDefault();
          els.btnToggleFullscreen.click();
        }
      });

      /* ======================== INSTANT DEEP-LINK URL HYDRATION (0ms DELAY) ======================== */
      function initFromUrl() {
        var params = new URLSearchParams(window.location.search);

        var qScenario = params.get("scenario");
        if (qScenario && DATA.scenarios[qScenario]) {
          state.scenarioId = qScenario;
        }

        var qMode = params.get("mode");
        if (qMode === "blind" || qMode === "governed") {
          state.mode = qMode;
        }

        var qRole = params.get("role");
        var rlsCfg = getScenarioRlsConfig();
        if (qRole && rlsCfg && rlsCfg.roles && rlsCfg.roles[qRole]) {
          state.rlsRole = qRole;
        }

        var sc = getScenario();

        var qCountRaw = params.get("q");
        if (qCountRaw !== null) {
          var qCount = parseInt(qCountRaw, 10);
          if (!isNaN(qCount) && qCount >= 1) {
            var wantAudit = qCount >= 7 && sc.siblingResponses && sc.siblingResponses.closing_session_audit;
            var maxN = Math.min(qCount, sc.turns.length);
            for (var i = 0; i < maxN; i++) {
              var mForTurn = (wantAudit || i < maxN - 1) ? "governed" : (qMode === "governed" ? "governed" : "blind");
              appendEntryAndAnimate({
                kind: "turn",
                promptText: sc.turns[i].prompt,
                turnIndex: i,
                initialMode: mForTurn
              }, true);
            }
            if (wantAudit) {
              appendEntryAndAnimate({
                kind: "sibling",
                promptText: "Compare Raw Schema vs. Knowledge Catalog runs from this session",
                siblingId: "closing_session_audit"
              }, true);
              state.selectedEntryId = state.entries[state.entries.length - 1].entryId;
            }
          }
        }

        var qPanel = params.get("panel");
        if (qPanel === "open") {
          state.inspectorOpen = true;
          if (window.innerWidth <= 1680) {
            state.railCollapsed = true;
            state.autoCollapsedByInspector = true;
          }
        } else if (qPanel === "closed") {
          state.inspectorOpen = false;
        }

        renderAll();

        if (state.entries.length > 0) {
          scrollToLatestEntryStart(false);
        }
      }

      initFromUrl();
    })();
  </script>
  <script src="./live_bridge.js" defer></script>
</body>
</html>
