[project]
name = "context-is-all-you-need"
version = "0.1.0"
description = "Declarative ScenarioPack benchmark & interactive Stage/Workbench showcase for governed enterprise context on BigQuery and Knowledge Catalog."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "google-auth>=2.35.0",
    "google-cloud-bigquery>=3.26.0",
    "jsonschema>=4.23.0",
    "pyyaml>=6.0.2",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.2",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
